echo "TTS Config has been sucessfully loaded 
echo "---------------------------------------------------------"
con_logfile log.txt
voice_loopback 1
voice_buffer_ms 100  // how you hear others; lower = choppier for you, doesn't change what they hear
Alias voicetoggle "voicetoggleon"
alias voicetoggleon "+voicerecord; con_logfile log.txt; alias voicetoggle voicetoggleoff"
alias voicetoggleoff "-voicerecord; alias voicetoggle voicetoggleon"
bind "KP_ENTER" "voicetoggle"

Alias blockadd "say !block add"
bind "KP_MINUS" "blockadd"

Alias adminadd "say !admin add"
bind "KP_PLUS" "adminadd"

Alias blockclear "say !block clear"
	bind "KP_MULTIPLY" "blockclear"
Alias stoptts "say !stop"
	bind "kp_slash" "stoptts"
Alias mutetts "say !mute"
	bind "KP_DEL" "mutetts"
Alias approvesong "say !approve"
Alias denysong "say !deny"
Alias skipsong "say !skipsong"
	bind "KP_HOME" "approvesong"
	bind "KP_PGUP" "denysong"
	bind "KP_UPARROW" "skipsong"


// ---------------------------------------------------------------------------------------------
// Optional: SILENT keys. The binds above "say" the command, so everyone on the server sees it.
// "echo" only puts it in your console/log.txt, which TF2Speech reads - nobody else sees a thing.
